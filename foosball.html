<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>فوتبال دستی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma;-webkit-tap-highlight-color:transparent;user-select:none}
body{min-height:100vh;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;touch-action:none}
h1{margin:8px 0}
canvas{background:linear-gradient(#2e8b3d,#256b31);border:4px solid #fff;border-radius:10px;touch-action:none;max-width:100vw}
#sc{font-size:1.3rem;margin:6px}
a{color:#7fd;margin:10px;text-decoration:none}
#ctrls{display:flex;gap:20px;margin:12px}
.btn{width:90px;height:70px;font-size:2rem;background:#333;border:2px solid #666;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<h1>⚽ فوتبال دستی</h1>
<div id="sc">شما <span id="p">0</span> — <span id="e">0</span> حریف</div>
<canvas id="cv" width="360" height="560"></canvas>
<div id="ctrls"><div class="btn" id="up">⬆️</div><div class="btn" id="dn">⬇️</div></div>
<a href="index.html">⬅ بازگشت</a>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const PW=14,PH=90;
let py=H/2-PH/2,ey=H/2-PH/2,ps=0,es=0;
let bx=W/2,by=H/2,vx=4,vy=3,bx0=0,by0=0,bx1=0,by1=0;
const px=W-40, ex=40;
let touchDir=0;
function upstart(e){e.preventDefault();touchDir=-6;} function dnstart(e){e.preventDefault();touchDir=6;}
function endt(e){e.preventDefault();touchDir=0;}
const u=document.getElementById('up'),d=document.getElementById('dn');
u.addEventListener('touchstart',upstart);u.addEventListener('touchend',endt);u.addEventListener('mousedown',upstart);u.addEventListener('mouseup',endt);
d.addEventListener('touchstart',dnstart);d.addEventListener('touchend',endt);d.addEventListener('mousedown',dnstart);d.addEventListener('mouseup',endt);
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];const r=cv.getBoundingClientRect();py=(t.clientY-r.top)*(H/r.height)-PH/2;},{passive:false});
function reset(dir){bx=W/2;by=H/2;vx=4*dir;vy=(Math.random()*4-2)||3;}
function loop(){
 py+=touchDir; py=Math.max(0,Math.min(H-PH,py));
 // simple AI
 const tgt=by-PH/2; ey+=(tgt>ey?4.2:tgt<ey?-4.2:0); ey=Math.max(0,Math.min(H-PH,ey));
 bx0=bx;by0=by;
 bx+=vx;by+=vy;
 if(by<8||by>H-8)vy=-vy;
 // player paddle (right)
 if(bx+8>px&&bx+8<px+PW+8&&by>py-8&&by<py+PH+8){vx=-Math.abs(vx)*1.03;vy+=(by-(py+PH/2))/12;}
 // enemy paddle (left)
 if(bx-8<ex+PW&&bx-8>ex-8&&by>ey-8&&by<ey+PH+8){vx=Math.abs(vx)*1.03;vy+=(by-(ey+PH/2))/12;}
 if(bx>W+10){ps++;document.getElementById('p').textContent=ps;reset(-1);}
 if(bx<-10){es++;document.getElementById('e').textContent=es;reset(1);}
 // draw
 ctx.clearRect(0,0,W,H);
 ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.strokeRect(10,10,W-20,H-20);
 ctx.fillStyle='#ffeb3b';ctx.beginPath();ctx.arc(bx,by,8,0,7);ctx.fill();
 ctx.fillStyle='#fff';
 ctx.fillRect(px,py,PW,PH);
 ctx.fillStyle='#f33';
 ctx.fillRect(ex,ey,PW,PH);
 requestAnimationFrame(loop);
}
reset(1);loop();
</script>
</body>
</html>
