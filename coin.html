<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>شیر یا خط</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;touch-action:manipulation}
h1{margin-bottom:40px}
.scene{perspective:900px;width:200px;height:200px}
#coin{width:200px;height:200px;position:relative;transform-style:preserve-3d;transition:transform 2.2s cubic-bezier(.2,.7,.3,1)}
.face{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:70px;backface-visibility:hidden;box-shadow:0 0 40px rgba(255,215,0,.5)}
.front{background:radial-gradient(circle at 35% 35%,#ffe680,#d4a017)}
.back{background:radial-gradient(circle at 35% 35%,#e8eef5,#9aa7b5);transform:rotateY(180deg)}
#btn{margin-top:50px;padding:16px 45px;font-size:1.2rem;font-weight:bold;border:none;border-radius:30px;background:linear-gradient(135deg,#f7971e,#ffd200);color:#3b2f00;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#res{margin-top:22px;font-size:1.5rem;min-height:2em}
a{color:#ffd200;margin-top:25px;text-decoration:none}
</style>
</head>
<body>
<h1>🪙 شیر یا خط</h1>
<div class="scene"><div id="coin"><div class="face front">🦁</div><div class="face back">🦅</div></div></div>
<div id="res"></div>
<button id="btn">پرتاب سکه!</button>
<a href="index.html">⬅ بازگشت</a>
<script>
const coin=document.getElementById('coin'),res=document.getElementById('res'),btn=document.getElementById('btn');
let spins=0;
btn.addEventListener('click',()=>{
 const isHeads=Math.random()<0.5;
 spins+=Math.floor(Math.random()*4)+4;
 const deg=isHeads?spins*360:spins*360+180;
 coin.style.transform='rotateY('+deg+'deg)';
 res.textContent='...';
 setTimeout(()=>{res.textContent=isHeads?'🦁 شیر!':'🦅 خط!';},2300);
});
</script>
</body>
</html>
