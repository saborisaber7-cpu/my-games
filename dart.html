<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>dart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma;-webkit-tap-highlight-color:transparent;user-select:none}
body{min-height:100vh;background:linear-gradient(135deg,#232526,#414345);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation}
h1{margin-bottom:10px}
#score{font-size:1.4rem;margin:8px;min-height:1.5em}
canvas{border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);touch-action:none;max-width:95vw}
a{color:#ffb74d;margin:14px;text-decoration:none}
</style>
</head>
<body>
<h1>🎯 دارت</h1>
<div>روی تخته بزن تا دارت پرتاب شود!</div>
<div id="score"></div>
<canvas id="cv" width="360" height="360"></canvas>
<a href="index.html">⬅ بازگشت</a>
<script>
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const C=180,R=160;
function draw(darts){
 ctx.clearRect(0,0,360,360);
 const rings=[[R,"#f5f5f5"],[R*0.82,"#333"],[R*0.62,"#f5f5f5"],[R*0.45,"#333"],[R*0.28,"#f5f5f5"],[R*0.14,"#e53935"]];
 rings.forEach(function(r){ctx.beginPath();ctx.arc(C,C,r[0],0,7);ctx.fillStyle=r[1];ctx.fill();ctx.strokeStyle="#999";ctx.stroke();});
 ctx.beginPath();ctx.arc(C,C,5,0,7);ctx.fillStyle="#e53935";ctx.fill();
 darts.forEach(function(d){
  ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x,d.y+16);ctx.strokeStyle="#000";ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(d.x,d.y,4,0,7);ctx.fillStyle="#ff1744";ctx.fill();
 });
}
let darts=[],total=0;
draw(darts);
function throwDart(x,y){
 darts.push({x:x,y:y});
 const dist=Math.hypot(x-C,y-C);
 let s=0;
 if(dist<R*0.14)s=50;else if(dist<R*0.28)s=25;else if(dist<R*0.45)s=15;else if(dist<R*0.62)s=10;else if(dist<R*0.82)s=5;else if(dist<R)s=1;
 total+=s;
 document.getElementById("score").textContent="🏆 امتیاز: "+s+" | مجموع: "+total;
 draw(darts);
}
cv.addEventListener("touchstart",function(e){e.preventDefault();const t=e.touches[0];const r=cv.getBoundingClientRect();throwDart((t.clientX-r.left)*(360/r.width),(t.clientY-r.top)*(360/r.height));},{passive:false});
cv.addEventListener("click",function(e){const r=cv.getBoundingClientRect();throwDart((e.clientX-r.left)*(360/r.width),(e.clientY-r.top)*(360/r.height));});
</script>
</body>
</html>
