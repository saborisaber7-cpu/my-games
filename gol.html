<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>گل یا پوچ</title>
<style>
  body{margin:0;font-family:Tahoma,sans-serif;background:linear-gradient(#134e5e,#71b280);
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       color:#fff;touch-action:manipulation}
  h1{font-size:26px;text-shadow:2px 2px 4px #000}
  #score{font-size:20px;margin:10px;background:rgba(0,0,0,.35);padding:6px 18px;border-radius:12px}
  #hand{font-size:120px;cursor:pointer;user-select:none;transition:transform .15s}
  #hand:active{transform:scale(.9)}
  #msg{font-size:22px;min-height:30px;margin-top:12px}
  #reset{margin-top:16px;padding:10px 24px;font-size:16px;border:none;border-radius:10px;
         background:#ffce54;color:#333;font-family:inherit}
</style>
</head>
<body>
<h1>✊ گل یا پوچ ✊</h1>
<div id="score">برد: 0 | باخت: 0</div>
<div id="hand">✊</div>
<div id="msg">دست بسته است — روی دست ضربه بزن!</div>
<button id="reset">شروع مجدد</button>
<script>
let score={win:0,lose:0},open=false;
const hand=document.getElementById('hand'),msg=document.getElementById('msg');
function closeHand(){open=false;hand.textContent='✊';msg.textContent='دست بسته است — روی دست ضربه بزن!';}
hand.addEventListener('click',()=>{
  if(open){closeHand();return;}
  open=true;
  const win=Math.random()<0.5;
  hand.textContent=win?'🟡':'🖐️';
  msg.textContent=win?'🎉 گِل! بردی':'پوچ! باختی';
  if(win)score.win++;else score.lose++;
  document.getElementById('score').textContent='برد: '+score.win+' | باخت: '+score.lose;
});
document.getElementById('reset').addEventListener('click',()=>{score={win:0,lose:0};
  document.getElementById('score').textContent='برد: 0 | باخت: 0';closeHand();});
</script>
</body>
</html>
