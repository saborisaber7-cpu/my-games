<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>حمله به رودخانه</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma;-webkit-tap-highlight-color:transparent;user-select:none}
body{min-height:100vh;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;touch-action:none}
h1{margin:8px 0;font-size:1.2rem}
#hud{display:flex;gap:20px;font-size:1.1rem;margin:4px}
canvas{border:3px solid #0ff;border-radius:8px;touch-action:none;max-width:100vw}
a{color:#0ff;margin:10px;text-decoration:none}
</style>
</head>
<body>
<h1>✈️ حمله به رودخانه</h1>
<div id="hud"><div>⭐ امتیاز: <span id="sc">0</span></div><div>❤️ جان: <span id="hp">3</span></div></div>
<canvas id="cv" width="360" height="600"></canvas>
<div style="margin:6px;opacity:.8">لمس چپ/راست = حرکت | ضربه وسط = شلیک</div>
<a href="index.html">⬅ بازگشت</a>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=360,H=600;
let px=W/2, py=H-70, score=0, hp=3, over=false;
let bullets=[],enemies=[],t=0;
let riverOffset=0;
const RIVERX=70, RIVERW=W-140;
function spawn(){ if(Math.random()<0.03) enemies.push({x:RIVERX+20+Math.random()*(RIVERW-60),y:-30,w:36,h:30}); }
function shoot(){ if(!over) bullets.push({x:px,y:py-20}); }
function hitPlane(){ hp--; document.getElementById('hp').textContent=hp; if(hp<=0){over=true;} }
cv.addEventListener('touchstart',e=>{
 e.preventDefault();
 for(const tch of e.changedTouches){
  const x=(tch.clientX-cv.getBoundingClientRect().left)*(W/cv.getBoundingClientRect().width);
  if(x<W*0.33)px-=34;
  else if(x>W*0.67)px+=34;
  else shoot();
 }
},{passive:false});
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')px-=34;
 if(e.key==='ArrowRight')px+=34;
 if(e.key===' ')shoot();
});
function loop(){
 if(!over){
  t++; riverOffset=(riverOffset+4)%60;
  spawn();
  px=Math.max(20,Math.min(W-20,px));
  bullets.forEach(b=>b.y-=8); bullets=bullets.filter(b=>b.y>-10);
  enemies.forEach(e=>e.y+=3.2);
  // collisions bullet-enemy
  enemies.forEach(e=>{ bullets.forEach(b=>{ if(Math.abs(b.x-e.x)<22&&Math.abs(b.y-e.y)<20){e.dead=true;b.dead=true;score+=10;} }); });
  enemies.forEach(e=>{ if(Math.abs(e.x-px)<26&&Math.abs(e.y-py)<24&&!e.dead){e.dead=true;hitPlane();} });
  enemies=enemies.filter(e=>!e.dead&&e.y<H+40);
  bullets=bullets.filter(b=>!b.dead);
  if(t%60===0)score+=1;
  document.getElementById('sc').textContent=score;
 }
 // draw
 ctx.fillStyle='#0a2a0a';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#123a8a';ctx.fillRect(RIVERX,0,RIVERW,H);
 ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;
 for(let y=-60+riverOffset;y<H;y+=60){ctx.beginPath();ctx.moveTo(RIVERX+10,y);ctx.lineTo(RIVERX+RIVERW-10,y);ctx.stroke();}
 enemies.forEach(e=>{ctx.fillStyle='#c33';ctx.fillRect(e.x-18,e.y-15,36,30);ctx.fillStyle='#fff';ctx.fillRect(e.x-10,e.y-5,20,10);});
 bullets.forEach(b=>{ctx.fillStyle='#ff0';ctx.fillRect(b.x-2,b.y-8,4,12);});
 // plane
 ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(px,py-20);ctx.lineTo(px-16,py+14);ctx.lineTo(px,py+6);ctx.lineTo(px+16,py+14);ctx.closePath();ctx.fill();
 if(over){
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='28px Tahoma';ctx.textAlign='center';
  ctx.fillText('💥 بازی تمام شد!',W/2,H/2-10);
  ctx.font='18px Tahoma';ctx.fillText('امتیاز: '+score,W/2,H/2+25);
  ctx.fillText('برای شروع دوباره لمس کن',W/2,H/2+55);
  cv.onpointerdown=()=>{if(over){over=false;hp=3;score=0;enemies=[];bullets=[];px=W/2;document.getElementById('hp').textContent=3;cv.onpointerdown=null;}};
 }
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
