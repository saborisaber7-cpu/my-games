<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>هواپیما روی رودخانه</title>
<style>
  body{margin:0;background:#000;color:#fff;font-family:Tahoma,sans-serif;overflow:hidden;user-select:none}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:10;text-align:center;padding:16px}
  #overlay h1{font-size:24px}
  #startBtn{margin-top:20px;padding:14px 40px;font-size:20px;font-family:inherit;border:none;
    border-radius:12px;background:#4caf50;color:#fff}
  #hud{position:fixed;top:6px;right:10px;font-size:16px;text-shadow:1px 1px 2px #000;z-index:5}
  canvas{display:block;touch-action:none}
</style>
</head>
<body>
<div id="overlay">
  <h1>✈️ بازی هواپیما — روی رودخانه</h1>
  <p>برای شروع صدا و بازی، دکمه را بزن.<br>انگشتت را روی صفحه بکش تا هواپیما حرکت کند و شلیک شود.</p>
  <button id="startBtn">▶ شروع بازی (فعال‌سازی صدا)</button>
</div>
<div id="hud">امتیاز: 0 | جان: ❤️❤️❤️</div>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=innerWidth;cv.height=innerHeight;
let running=false,score=0,lives=3,px=cv.width/2,py=cv.height-90,ptx=px,pty=py;
let bullets=[],enemies=[],explo=[],ticks=0,cool=0;
const hud=document.getElementById('hud');

// ---------- Web Audio ----------
let AC=null;
function initAudio(){AC=new (window.AudioContext||window.webkitAudioContext)();}
function beep(freq,dur,type,vol,slideTo){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(freq,AC.currentTime);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,AC.currentTime+dur);
  g.gain.setValueAtTime(vol||0.15,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
}
const sShoot=()=>beep(900,0.12,'square',0.12,300);
const sBoom=()=>{beep(120,0.4,'sawtooth',0.25,30);beep(60,0.5,'triangle',0.2,20);};
const sHurt=()=>beep(200,0.5,'sawtooth',0.3,60);

// ---------- Input ----------
function move(e){
  ptx=e.clientX;pty=e.clientY-60;
  if(running&&cool<=0){bullets.push({x:px,y:py-25});sShoot();cool=8;}
}
cv.addEventListener('pointermove',move);
cv.addEventListener('pointerdown',move);

function spawn(){enemies.push({x:Math.random()*(cv.width-40)+20,y:-30,vy:1.5+Math.random()*2});}

function loop(){
  if(running){
    ticks++;cool--;
    px+=(ptx-px)*0.2;py+=(pty-py)*0.2;
    if(ticks%45===0)spawn();
    ctx.fillStyle='#0af';ctx.fillRect(0,0,cv.width,cv.height);
    // رودخانه
    ctx.fillStyle='#1e90ff';
    ctx.beginPath();ctx.moveTo(cv.width*0.25,0);
    for(let y=0;y<=cv.height;y+=40)ctx.lineTo(cv.width*0.25+40*Math.sin((y+ticks*2)/100),y);
    for(let y=cv.height;y>=0;y-=40)ctx.lineTo(cv.width*0.45+40*Math.sin((y+ticks*2)/100),y);
    ctx.closePath();ctx.fill();
    // گلوله‌ها
    ctx.fillStyle='#ff0';
    bullets.forEach(b=>{b.y-=8;ctx.fillRect(b.x-2,b.y,4,12);});
    bullets=bullets.filter(b=>b.y>-20);
    // برخورد گلوله و دشمن
    bullets.forEach(b=>{
      enemies=enemies.filter(e=>{
        if(Math.abs(e.x-b.x)<20&&Math.abs(e.y+10-b.y)<22){
          score+=10;explo.push({x:e.x,y:e.y,t:20});sBoom();return false;}
        return true;});
    });
    // حرکت و رسم دشمن‌ها
    enemies.forEach(e=>{
      e.y+=e.vy;
      ctx.fillStyle='#f55';
      ctx.fillRect(e.x-15,e.y,30,20);ctx.fillRect(e.x-5,e.y-8,10,10);
    });
    // برخورد دشمن با هواپیما
    enemies=enemies.filter(e=>{
      if(Math.abs(e.x-px)<25&&Math.abs(e.y-py)<25){
        lives--;sHurt();
        if(lives<=0){running=false;hud.textContent='باختی! امتیاز: '+score;}
        return false;}
      if(e.y>cv.height+30)return false;
      return true;});
    // انفجارها
    explo=explo.filter(ex=>{
      ex.t--;ctx.strokeStyle='#ff8800';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(ex.x,ex.y,(20-ex.t)*2,0,7);ctx.stroke();
      return ex.t>0;});
    ctx.font='36px serif';ctx.fillStyle='#fff';
    ctx.fillText('✈️',px-18,py+18);
    if(running)hud.textContent='امتیاز: '+score+' | جان: '+'❤️'.repeat(Math.max(0,lives));
  }else{
    ctx.fillStyle='#0af';ctx.fillRect(0,0,cv.width,cv.height);
  }
  requestAnimationFrame(loop);
}
document.getElementById('startBtn').addEventListener('click',()=>{
  initAudio();
  if(AC.state==='suspended')AC.resume();
  document.getElementById('overlay').style.display='none';
  running=true;
});
addEventListener('resize',()=>{cv.width=innerWidth;cv.height=innerHeight;});
loop();
</script>
</body>
</html>
